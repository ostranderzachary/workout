<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musclemap</title>
<meta name="description" content="Log workouts, record runs with GPS, and see the muscles you trained on a body heat map.">
<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Musclemap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Musclemap</h1><span class="sync" id="sync">Loading…</span></div>
    <div class="top-actions">
      <button class="btn desk-only" type="button" data-open="log">Log lifts</button>
      <button class="btn primary desk-only" type="button" data-open="record"><span class="rec-dot" aria-hidden="true"></span>Record</button>
      <button class="iconbtn" id="settingsBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="periods" role="group" aria-label="Time range" id="periods">
    <button type="button" data-p="day">Day</button>
    <button type="button" data-p="week">Week</button>
    <button type="button" data-p="month">Month</button>
    <button type="button" data-p="year">Year</button>
    <button type="button" data-p="all">All</button>
  </div>
  <div class="nav">
    <button class="iconbtn" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="label" id="rangeLabel"></div>
    <button class="iconbtn" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div class="grid">
    <section class="panel mapcol" aria-label="Muscle heat map">
      <div class="stats" id="stats"></div>
      <div class="bodies" id="bodies"></div>
      <div class="legend" id="legend"></div>
      <div id="selinfo"></div>
    </section>
    <div class="side">
      <section class="panel">
        <h2 id="barsTitle">Sets per muscle</h2>
        <ul class="bars" id="bars"></ul>
        <p class="note" id="barsNote"></p>
      </section>
      <section class="panel">
        <h2>Workouts</h2>
        <ul class="history" id="history"></ul>
      </section>
    </div>
  </div>
</div>

<nav class="dock" aria-label="Add a workout">
  <button class="btn" type="button" data-open="log">Log lifts</button>
  <button class="btn primary" type="button" data-open="record"><span class="rec-dot" aria-hidden="true"></span>Record</button>
</nav>

<div id="sheetRoot"></div>
<div id="screenRoot" hidden></div>
<div id="cardioSheet"></div>
<div id="settingsRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
